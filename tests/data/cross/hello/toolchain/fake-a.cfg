# Fake target toolchain used by tests/cross/run-tests.sh
toolchain {
  id       { fake-aarch64 }
  system   { android }
  arch     { aarch64 }
  arch-alt { arm64 }
  bits     { 64 }
  endian   { little }
  cc       { SS{cross-cc.sh} }
  ar       { ar }
  cflags   { -DFAKE_TARGET=1 }
  ldflags  { }
  host-cc  { cc }
  host-cxx { c++ }
  host-cflags   { -DHOST_TOOL_BUILD=1 }
  host-cxxflags { -DHOST_TOOL_CXX=1 }
  sysroot  { /opt/fake/sysroot }
}
