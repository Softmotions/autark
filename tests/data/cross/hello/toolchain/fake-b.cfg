# Alternative fake target, used to verify that switching the target in the same
# cache invalidates previously built objects
toolchain {
  id       { fake-x86-64 }
  system   { linux }
  arch     { x86_64 }
  bits     { 64 }
  endian   { little }
  cc       { SS{cross-cc.sh} }
  ar       { ar }
  cflags   { -DFAKE_TARGET=2 }
  host-cc  { cc }
}
